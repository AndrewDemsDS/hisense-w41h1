version: 2
# Automated dependency-update PRs. GitHub Actions are SHA-pinned in the workflows
# (supply-chain safety); Dependabot proposes the bumps as reviewable PRs so the pins
# stay current without hand-resolving SHAs. Python ecosystems track the pinned
# requirements files: the clip flasher, the reverse-engineering tooling, the lint
# tools CI installs.
#
# Every entry waits a week after a release before proposing it (cooldown): a version
# that is pulled or found malicious in its first days never reaches a pull request.
#
# What nothing here can follow, because Dependabot reads no shell or YAML variables:
#   - clang-format and clang-tidy in firmware/scripts/cpp-lint.sh. They are ESPHome's own
#     pins and move when the ESPHome release moves, not when a newer clang exists.
#   - the espressif/mdns component of firmware/esp32-recon/main/idf_component.yml.
#
# The ESPHome release (every place version-lint.py lists) and the ESP-IDF image of the nightly
# esp32-recon job are not here: .github/workflows/pin-bumps.yaml moves each one in a single pull
# request (firmware/scripts/pin-bump.py). A Dependabot entry for .github/ci/esphome would open a
# second pull request for the same release that bumps one of the five pins and fails CI.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /firmware/flasher
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  - package-ecosystem: pip
    directory: /reverse-engineering/tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build

  # actionlint, zizmor, cppcheck, ruff, gcovr: the versions the QA workflow installs.
  - package-ecosystem: pip
    directory: /.github/ci/lint
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      lint-tools:
        patterns: ["*"]
