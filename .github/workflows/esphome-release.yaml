name: ESPHome release

# A release of the ESPHome firmware: the components, the packages and the board files at one
# version. Pushing the tag `v<version>` is the whole trigger (CONTRIBUTING.md, "Releasing").
#
# The release has NO firmware images attached, on purpose. An image built here is built with
# secrets.yaml.example, so it holds a Wi-Fi name nobody has, and an API key and a hotspot
# password that are public in this repository. Whoever flashed it would have a node that anyone
# who has read the example file can talk to, and that node drives an A/C. A user builds their own
# image from the tagged tree with their own secrets, and the release text says how.
#
# The old `amebaz2-v*` and `esp32-v*` tags belong to the retired Matter firmwares and do not
# start this workflow.
#
# Started by hand (workflow_dispatch, from any branch) it is a DRY RUN: every gate and every
# compile runs, and the last job prints the release it would have made in place of making it.
# Nothing is tagged and nothing is published. In a dry run the tag is taken to be `v<version>`,
# and the two gates that depend on the release commit (the changelog has the version's own
# section, the commit is on main) are reported and do not stop the compiles, so one run shows
# everything a real tag would trip over. The run still ends red when one of them failed.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

# Nothing is granted here. Each job states what it needs, and only `release` may write.
permissions: {}

# Kept equal to qa.yaml's pin by firmware/scripts/version-lint.py.
env:
  ESPHOME_VERSION: "2026.10.0"

concurrency:
  group: esphome-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag, the version file and the changelog agree, the tagged commit is on main, and the host
  # tests pass. A missing changelog section fails here, before anything is compiled.
  verify:
    # GitHub-only: the Gitea mirror reads this directory too and has no hosted runner.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      notes: ${{ steps.notes.outputs.notes }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      tag-gate: ${{ steps.tag.outcome }}
      main-gate: ${{ steps.main.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # main, to check the tag is on it, and the older tags
          persist-credentials: false

      - name: The version and its tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python3 firmware/scripts/version-lint.py --print)"
          # A dry run has no tag: it checks the one this tree would be released under.
          if [ "$EVENT" = push ]; then tag="$REF_NAME"; else tag="v$version"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version $version, tag $tag ($EVENT)"

      # In a dry run these two gates report and the run goes on (see the top of this file).
      - name: Tag, version and changelog agree
        id: tag
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python3 firmware/scripts/version-lint.py --tag "$TAG"

      - name: The tagged commit is on main
        id: main
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the commit is not on main: a release is cut from main"
            exit 1
          fi

      - name: Host QA
        run: bash firmware/test/run_tests.sh

      - name: ESPHome config validation
        run: |
          pipx install "esphome==$ESPHOME_VERSION"
          cd firmware/esphome
          cp secrets.yaml.example secrets.yaml   # placeholders; the real file is gitignored
          for b in w41h1*.yaml tests/build*.yaml; do esphome config "$b" > /dev/null; done

      # The compile matrix, from the board files: every w41h1*.yaml is in exactly one group
      # (.github/scripts/board-groups.sh), so no list of them is written here.
      - name: Board files to compile
        id: matrix
        run: |
          matrix="$(bash .github/scripts/board-groups.sh matrix)"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # The changelog section plus how to use the release. It is handed to the last job as an
      # output, so the one job that can write runs nothing from the tree.
      - name: Release text
        id: notes
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          section="$VERSION"
          # A dry run before the changelog is dated shows what is under Unreleased.
          if [ "$EVENT" != push ] && ! python3 firmware/scripts/version-lint.py --notes "$VERSION" > /dev/null 2>&1; then
            section=Unreleased
          fi
          {
            python3 firmware/scripts/version-lint.py --notes "$section"
            echo
            echo "## Using this release"
            echo
            echo "There are no firmware images attached. An image has to be built with your own"
            echo "Wi-Fi credentials, API key and hotspot password, so you build it from this tag:"
            echo
            echo '```bash'
            echo "git clone --branch v$VERSION --depth 1 https://github.com/$REPO"
            echo "cd $(basename "$REPO")/firmware/esphome"
            echo "cp secrets.yaml.example secrets.yaml   # then fill it in"
            echo "esphome run w41h1-esp32c3.yaml         # or the file for your board"
            echo '```'
            echo
            echo "Built with ESPHome $ESPHOME_VERSION. To use the components and packages from"
            echo "your own configuration, pinned to this tag, see"
            echo "[Using a release from your own configuration](https://github.com/$REPO/blob/v$VERSION/firmware/esphome/README.md#using-a-release-from-your-own-configuration)."
          } > release-notes.md
          cat release-notes.md
          delimiter="notes-$(openssl rand -hex 16)"
          { echo "notes<<$delimiter"; cat release-notes.md; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  # Every board file compiles from the tagged tree, the components without a warning of their
  # own, and each image carries the version. One job per toolchain, so they run side by side.
  # The trees the QA workflow saved from main are restored and nothing is saved here. The stock
  # module's build cache is not restored: an object taken from it prints no compiler output, and
  # a release has to see every warning. ccache replays the output, so the ESP32 group takes
  # its cache. The images are thrown away (see the top of this file).
  compile:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The keys are the ones qa.yaml saves under.
      - name: Restore the ESP-IDF tree
        if: ${{ matrix.toolchain == 'esp32' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome/idf
          key: idf-esp32-tree-${{ env.ESPHOME_VERSION }}

      - name: Restore the ccache
        if: ${{ matrix.toolchain == 'esp32' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/w41h1/ccache
          # Never an exact hit: the newest entry for this ESPHome release is the one wanted.
          key: idf-esp32-ccache-${{ env.ESPHOME_VERSION }}-release-${{ github.run_id }}
          restore-keys: |
            idf-esp32-ccache-${{ env.ESPHOME_VERSION }}-

      - name: Restore the PlatformIO tree
        if: ${{ matrix.toolchain == 'amebaz2' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-amebaz2-tree-${{ env.ESPHOME_VERSION }}

      # ESPHome uses ccache for ESP-IDF builds when the binary is there.
      - name: ccache for the ESP-IDF build
        if: ${{ matrix.toolchain == 'esp32' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          echo "CCACHE_DIR=$HOME/.cache/w41h1/ccache" >> "$GITHUB_ENV"

      - name: Compile
        env:
          CONFIGS: ${{ matrix.configs }}
        run: |
          pipx install "esphome==$ESPHOME_VERSION"
          # Word splitting is wanted: CONFIGS is a list of file names from board-groups.sh.
          # shellcheck disable=SC2086
          bash firmware/scripts/esphome-compile-check.sh $CONFIGS

  # The only job that can write. It checks nothing out: it creates the GitHub release for the
  # tag from the text the verify job made, with no files attached. A dry run never gets here.
  release:
    if: ${{ github.event_name == 'push' }}
    needs: [verify, compile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > release-notes.md
          gh release create "$TAG" --verify-tag --title "ESPHome firmware $VERSION" \
            --notes-file release-notes.md

  # The dry run's last job, in place of `release`: what would have been published, and whether a
  # real tag would have got this far. It has no permission at all and checks nothing out.
  dry-run:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.server_url == 'https://github.com' }}
    needs: [verify, compile]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: What a release from this commit would be
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          NOTES: ${{ needs.verify.outputs.notes }}
          VERIFY: ${{ needs.verify.result }}
          COMPILE: ${{ needs.compile.result }}
          TAG_GATE: ${{ needs.verify.outputs.tag-gate }}
          MAIN_GATE: ${{ needs.verify.outputs.main-gate }}
          REF: ${{ github.ref }}
        run: |
          {
            echo "## Release dry run: nothing was tagged or published"
            echo
            echo "From \`$REF\` at \`$GITHUB_SHA\`. A real run starts with \`git push origin $TAG\`."
            echo
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| tag \`$TAG\`, the version and the changelog agree | $TAG_GATE |"
            echo "| the commit is on main | $MAIN_GATE |"
            echo "| host tests, config validation, release text (job verify) | $VERIFY |"
            echo "| every board file compiles (job compile) | $COMPILE |"
            echo
            echo "### The release text: \"ESPHome firmware $VERSION\""
            echo
            printf '%s\n' "$NOTES"
          } >> "$GITHUB_STEP_SUMMARY"
          for gate in "$TAG_GATE" "$MAIN_GATE" "$VERIFY" "$COMPILE"; do
            if [ "$gate" != success ]; then
              echo "::error::a real release from this commit would stop at a gate (tag $TAG_GATE, on main $MAIN_GATE, verify $VERIFY, compile $COMPILE)"
              exit 1
            fi
          done
          echo "every gate passed: pushing the tag $TAG on this commit would publish the release"
