name: QA

# Hardware-free gate: the lints, the host test suite the pre-commit hook runs (codec goldens, the
# ESPHome component against the reference driver, virtual-AC round-trip, image signing), and the
# ESPHome config and compile checks. No A/C, no chip.
#
# What runs where:
#   every push and pull request   host-qa (the one required check), version, lint-extra
#   when the firmware changed     esphome-esp32, esphome-amebaz2, esphome-upstream (job `changes`),
#                                 and esphome-host-e2e, which also runs when its own files changed
#   pushes to main only           coverage (a table in the job summary, never blocking)
#   every night                   nightly.yaml: fuzzing, the board files no job here compiles,
#                                 ESPHome's dev-branch gates, the esp32-recon build
#   started by hand or by a bot   every job but coverage, the compile jobs always (workflow_dispatch:
#                                 pin-bumps.yaml starts it on the branch of a pin bump pull request,
#                                 whose push made with GITHUB_TOKEN starts no workflow by itself)
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same branch or pull request replaces the run in progress: three pushes
# within half a minute used to run three full workflows side by side.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this gate only reads the tree (checkout + host scripts), never writes. Every
# job repeats it, so a job added later has to state its own.
permissions:
  contents: read

# The ESPHome release every job builds with, written once. firmware/scripts/version-lint.py holds
# it equal to the pins in dev.py, esphome-upstream-check.sh and esphome-release.yaml, and the
# lint-extra job holds .github/ci/esphome/requirements.txt (the copy nightly.yaml installs) equal to it.
env:
  ESPHOME_VERSION: "2026.10.0"

jobs:
  # Whether this run touches anything the three compile jobs build from. A change to the docs,
  # the host tests or the flasher skips them, which takes a pull request from about three minutes
  # to the length of host-qa. host-qa, version and lint-extra do not ask: they always run, so the
  # required check always reports.
  changes:
    # GitHub-only: Gitea mirrors this repo and auto-reads .github/workflows, but has no
    # ubuntu-latest runner. Skip on Gitea so the job doesn't queue forever there. The compile
    # jobs need this one, so they are skipped with it.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      firmware: ${{ steps.diff.outputs.firmware }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # the commit and its parents
          persist-credentials: false
      - name: Does this run change the firmware?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # What the compile jobs read: the components, packages, board files and test configs,
          # the scripts they call, and this workflow. Markdown under those paths is not built.
          inputs='^(firmware/esphome/|firmware/scripts/(esphome-|version-lint)|\.github/(workflows/qa\.yaml|scripts/board-groups\.sh|ci/esphome/))'
          files=""
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the pull request merged into its base, so the first parent is the base.
            files="$(git diff --name-only HEAD^1 HEAD)"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" HEAD)"
          fi
          # The end-to-end job builds from the same files and, on top of them, from its own
          # directory and the A/C model with the frame decoder it imports.
          e2e_inputs='^(firmware/test/(host_e2e/|virtual_ac\.py)|reverse-engineering/tools/decode_ac_frames\.py)'
          # No list (a new branch, a forced push, a push of several commits, a run started by
          # workflow_dispatch): compile.
          firmware=true
          e2e=true
          if [ -n "$files" ]; then
            built="$(grep -vE '\.mdx?$' <<<"$files" || true)"
            if ! grep -qE "$inputs" <<<"$built"; then
              firmware=false
              grep -qE "$e2e_inputs" <<<"$built" || e2e=false
            fi
          fi
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "changed files: $(wc -l <<<"$files"), compile jobs: $firmware, end-to-end job: $e2e"

  host-qa:
    # GitHub-only, as above.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Static lint first (cheap, fails fast). shellcheck ships on the runner image;
      # --severity=warning gates real bugs (quoting, unset vars, logic) and skips the info/style
      # nits the scripts intentionally use. Every tracked shell script and both hooks, from git,
      # so a script added anywhere in the tree is linted without a change here.
      - name: Shell lint (shellcheck)
        run: |
          shellcheck --version
          git ls-files -z '*.sh' 'firmware/.githooks/*' | xargs -0 shellcheck --severity=warning

      # ruff reads the committed ruff.toml. Its version is the one in the lint requirements file,
      # where Dependabot bumps it.
      - name: Python lint (ruff)
        run: pipx run --spec "$(grep -oE '^ruff==[0-9.]+' .github/ci/lint/requirements.txt)" ruff check .

      # C/C++ lint over every tree we own: clang-format
      # --dry-run -Werror, the ESPHome-derived custom rules, and clang-tidy over the host-compilable
      # set. The script pins clang-format 13.0.1 and clang-tidy 22.1.8 (ESPHome's pins) and installs
      # them into a private venv, since the runner's own clang-format is another major and formats
      # differently. Local parity: firmware/scripts/cpp-lint.sh check (fix applies the fixes).
      - name: C/C++ lint (clang-format, custom rules, clang-tidy)
        run: bash firmware/scripts/cpp-lint.sh check

      # The pre-commit hook's form: explicit paths after the options the wrapper inserts.
      - name: C/C++ lint, path form (as the pre-commit hook runs it)
        run: bash firmware/scripts/cpp-lint.sh check --no-tidy firmware/test/test_reference_map.cpp

      - name: Host QA
        run: bash firmware/test/run_tests.sh

      # Every C++ host test again, built with the address and undefined-behaviour sanitizers under
      # both compilers. A test file missing from the script's table fails the run.
      - name: Sanitizers (ASan + UBSan, g++ and clang++)
        run: bash firmware/test/sanitize.sh

      # The ESPHome variant has no other gate that always runs: its component is Python + C++
      # that the host tests only reach through the pure headers, so a broken schema or a renamed
      # option would otherwise reach a user's first `esphome run`. `config` validates the YAML AND
      # every platform schema of the components without a toolchain, in seconds. The real
      # compiles are the esphome-esp32 and esphome-amebaz2 jobs below.
      - name: ESPHome config validation
        run: |
          pipx install "esphome==$ESPHOME_VERSION"
          cd firmware/esphome
          cp secrets.yaml.example secrets.yaml   # placeholders; the real file is gitignored
          # Every board file: they share packages/, so a change made for one chip is checked
          # against all of them. The glob takes in a board file added later.
          for b in w41h1*.yaml; do esphome config "$b"; done
          # The -s override form the first nodes were built with. `dev.py --board c3` builds
          # w41h1-esp32c3.yaml itself now, and this form has to keep working.
          esphome -s board esp32-c3-devkitm-1 -s tx_pin 5 -s rx_pin 6 -s de_pin 10 config w41h1.yaml
          # The upstream-shaped component tests (tests/components/) set every option of every
          # platform, which the board files do not, and build.hub-only.* is the hub with no
          # platform at all.
          for t in tests/build*.yaml; do esphome config "$t"; done

  # The firmware version (firmware/esphome/packages/version.yaml), the changelog and the release
  # tags, with the history the checkout of host-qa does not have. host-qa already runs the checks
  # that need no history, through run_tests.sh. This job adds two. In a pull request, a change
  # under firmware/esphome/components/ or packages/ against the merge base has to come with a
  # CHANGELOG.md entry. No version bump is asked for: the number moves when a release is cut.
  # And with the tags fetched, the version may not be below the newest release.
  version:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the merge base and the tags
          persist-credentials: false
      - name: Version, changelog and release tags
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Started by hand on a branch (a pin bump pull request from pin-bumps.yaml): there is no
          # base ref, so the changelog rule is checked against the default branch.
          if [ -z "$BASE_REF" ] && [ "$EVENT" = workflow_dispatch ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            BASE_REF="$DEFAULT_BRANCH"
          fi
          if [ -n "$BASE_REF" ]; then
            python3 firmware/scripts/version-lint.py --base "origin/$BASE_REF"
          else
            python3 firmware/scripts/version-lint.py
          fi

  # The lints nothing else runs: the workflows themselves, the guide pages, and a second static
  # analyzer on the components. The tools come from .github/ci/lint/requirements.txt, one version
  # each, so the same commands give the same result on a workstation:
  #   python3 -m venv /tmp/lint && /tmp/lint/bin/pip install -r .github/ci/lint/requirements.txt
  lint-extra:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the lint tools
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet -r .github/ci/lint/requirements.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"

      # Syntax, expression types and contexts, and shellcheck on every `run:` block.
      - name: Workflows (actionlint)
        run: actionlint -color

      # Security audit of the workflows and of dependabot.yml: unpinned actions, credentials left
      # in a checkout, template injection, excessive permissions. Offline: it needs no token.
      # A finding is fixed in the workflow, not suppressed.
      - name: Workflows (zizmor)
        run: zizmor --offline --color=always .

      # Broken links, heading structure, the sidebar, and the leak denylist (home paths, LAN
      # addresses, node numbers) over docs/guide/.
      - name: Guide pages (docs/guide/lint.py)
        run: python3 docs/guide/lint.py

      # cppcheck on the code that compiles without ESPHome: the codec and the bus scheduler, and
      # three host tests that pull in the header-only parts (hisense_map.h, w41h1_uart_policy.h,
      # setup_mode_logic.h). Every component directory is on the include path, from the tree.
      # Gated on warning, performance and portability, which are clean. `style` is left out: its
      # findings are naming and "condition always true" in the tests, not defects. The ESPHome
      # glue is not checked here: cppcheck cannot parse it without ESPHome's headers (SUB_SENSOR
      # stops the analysis of every glue file), and clang-tidy covers the pure files in host-qa.
      - name: Components (cppcheck)
        run: |
          cppcheck --version
          c=firmware/esphome/components
          includes=()
          for name in $(bash firmware/scripts/esphome-components.sh); do
            includes+=(-I "$c/$name")
          done
          cppcheck --enable=warning,performance,portability --inconclusive --check-level=exhaustive \
            --std=c++17 --language=c++ --inline-suppr --quiet --error-exitcode=1 \
            --suppress=missingIncludeSystem "${includes[@]}" \
            "$c/hisense_ac/hisense_protocol.cpp" "$c/hisense_ac/hisense_bus.cpp" \
            firmware/test/test_esphome_map_gaps.cpp firmware/test/test_esphome_uart_policy.cpp \
            firmware/test/test_esphome_setup_mode.cpp

      # The copy of the ESPHome pin that the nightly workflow installs has to be the release the
      # jobs build with. firmware/scripts/pin-bump.py moves every pin at once.
      - name: The ESPHome pin of .github/ci/esphome is the one in use
        run: |
          if ! grep -qx "esphome==$ESPHOME_VERSION" .github/ci/esphome/requirements.txt; then
            echo "::error file=.github/ci/esphome/requirements.txt::this file names $(grep -oE '^esphome==.*' .github/ci/esphome/requirements.txt) and the workflows build with $ESPHOME_VERSION: bump ESPHOME_VERSION in qa.yaml and esphome-release.yaml, ESPHOME_PIN in firmware/scripts/dev.py and ESPHOME_SPEC in firmware/scripts/esphome-upstream-check.sh in the same pull request"
            exit 1
          fi

  # Line and branch coverage of the pure code under the host tests, as a table in the job
  # summary. On main only, and never blocking: the number is there to be looked at when a change
  # lands, not to fail one.
  coverage:
    if: ${{ github.server_url == 'https://github.com' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Coverage of the pure code (gcov + gcovr)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet -r .github/ci/lint/requirements.txt
          export PATH="$RUNNER_TEMP/lint/bin:$PATH"
          # The script runs gcovr through uvx, which takes the version from this file.
          export UV_CONSTRAINT="$PWD/.github/ci/lint/requirements.txt"
          out="$RUNNER_TEMP/coverage"
          bash firmware/test/coverage/run.sh --out "$out" > "$out.log" 2>&1 || { tail -n 60 "$out.log"; exit 1; }
          {
            echo "## Coverage of the pure code under the host tests"
            echo
            echo "Lines:"
            echo '```'
            cat "$out/lines.txt"
            echo '```'
            echo "Branches:"
            echo '```'
            cat "$out/branches.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$out/lines.txt" "$out/branches.txt"

  # The stock module's own MCU through ESPHome's LibreTiny platform (w41h1-amebaz2-*.yaml, one
  # per flash layout a unit can have). These are the board files nobody builds on the way to an
  # ESP32, and the one platform whose toolchain is small enough for a hosted runner (about 800 MB,
  # kept in the cache), so they get a real compile and not only `config`. All three layouts are
  # built because each one is checked at compile time: w41h1_slots.h in the w41h1_module
  # component fails the build when the image's slot addresses are not those of the layout the
  # file names. Compile-only: the images carry the placeholder secrets and are thrown away. They
  # say nothing about a module, which needs the hardware test.
  esphome-amebaz2:
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two cache entries, because they change at different times.
      #
      # PlatformIO's tree: the LibreTiny platform, the Realtek SDK and the ARM toolchain. The
      # three layouts share all of it, and it changes only with the ESPHome release, which is its
      # key. The entry is saved once per release.
      #
      # PlatformIO's build cache (PLATFORMIO_BUILD_CACHE_DIR below): every compiled object, kept
      # by content. Nearly all of them are the SDK's and the framework's, which depend on the
      # release and on the YAML, so that is the key. A change to the components recompiles the
      # few files of the components and saves nothing.
      #
      # Every run restores. Only main saves, and only an entry that does not exist yet, so a
      # pull request cannot fill the cache quota and a push that changes neither key saves
      # nothing. (The key used to be the run id: each push to main saved the whole tree again.)
      - name: Restore the PlatformIO tree
        id: tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-amebaz2-tree-${{ env.ESPHOME_VERSION }}
          # An entry from before the split, until the first save under the key above.
          restore-keys: |
            pio-esphome-amebaz2-

      - name: Restore the build cache
        id: objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/w41h1/pio-objects
          key: pio-amebaz2-objects-${{ env.ESPHOME_VERSION }}-${{ hashFiles('firmware/esphome/packages/**', 'firmware/esphome/w41h1-amebaz2-*.yaml') }}
          restore-keys: |
            pio-amebaz2-objects-${{ env.ESPHOME_VERSION }}-

      - name: Compile every flash layout
        run: |
          pipx install "esphome==$ESPHOME_VERSION"
          cd firmware/esphome
          cp secrets.yaml.example secrets.yaml   # placeholders; the real file is gitignored
          # An object served from the build cache prints no compiler output, so the warning check
          # below only sees what this run compiled. That is enough: an entry is saved only by a
          # main run that passed this step, so every cached object compiled clean.
          export PLATFORMIO_BUILD_CACHE_DIR="$HOME/.cache/w41h1/pio-objects"
          # Every component of this repo, from the directories: hisense_ac|w41h1_module|...
          own="$(bash ../scripts/esphome-components.sh regex)"
          # An entry from before the split holds the build cache inside the tree: move it out,
          # so it is used now and is not saved with the tree.
          if [ -d "$HOME/.platformio/w41h1-build-cache" ]; then
            if [ ! -d "$PLATFORMIO_BUILD_CACHE_DIR" ]; then
              mkdir -p "$(dirname "$PLATFORMIO_BUILD_CACHE_DIR")"
              mv "$HOME/.platformio/w41h1-build-cache" "$PLATFORMIO_BUILD_CACHE_DIR"
            fi
            rm -rf "$HOME/.platformio/w41h1-build-cache"
          fi
          # layout:address of the first slot. The app image is named after the address it is
          # built for, so the file name shows that the layout file was applied.
          for want in factory:0x010000 sdk:0x00C000 native:0x010000; do
            layout=${want%%:*}
            # Its own name, so each layout gets its own build directory.
            if ! esphome -s name "ac-$layout" compile "w41h1-amebaz2-$layout.yaml" > build.log 2>&1; then
              tail -n 200 build.log
              exit 1
            fi
            echo "== $layout"
            # PlatformIO puts a colour reset in front of its size lines, so they are not anchored.
            grep -a -E '(RAM|Flash): +\[|Successfully compiled' build.log
            # The SDK and the platform warn about their own code. Ours has to build clean here
            # too: this is the only target with a different compiler and integer widths.
            if grep -a -E "components/($own)/.*(warning|error)" build.log; then
              echo "::error::a component of this repo (${own//|/, }) does not compile cleanly for AmebaZ2 (see above)"
              exit 1
            fi
            # The reboot workaround points lt_reboot() at the SDK's sys_reset with two linker
            # flags. If a platform update drops sys_reset the link fails above.
            out=".esphome/build/ac-$layout/.pioenvs/ac-$layout"
            # LibreTiny writes the slot image as a side effect of the link step. A checkout is
            # new, so ESPHome's build stamp differs, one file compiles and the link runs. Should
            # the cache ever hand back the linked firmware whole, the image is missing: build
            # that layout once more without the cache.
            if [ ! -f "$out/image_firmware_is.${want##*:}.bin" ]; then
              echo "no slot image after a fully cached build: building $layout without the cache"
              rm -f "$out/raw_firmware.elf" "$out/firmware.uf2"
              env -u PLATFORMIO_BUILD_CACHE_DIR esphome -s name "ac-$layout" \
                compile "w41h1-amebaz2-$layout.yaml" > build.log 2>&1 || { tail -n 200 build.log; exit 1; }
            fi
            ls -l "$out/firmware.uf2" "$out/image_firmware_is.${want##*:}.bin"
          done
          # Every layout the tree has is one of the three built above.
          for b in $(bash ../../.github/scripts/board-groups.sh amebaz2); do
            case "$b" in
              w41h1-amebaz2-factory.yaml | w41h1-amebaz2-sdk.yaml | w41h1-amebaz2-native.yaml) ;;
              *) echo "::error::$b is a stock-module board file this job does not build: add its layout and slot address to the list above"; exit 1 ;;
            esac
          done
          # PlatformIO never prunes the build cache. Start it again once it has grown past what
          # three layouts need several times over (about 80 MB each).
          if [ "$(du -sm "$PLATFORMIO_BUILD_CACHE_DIR" | cut -f1)" -gt 1024 ]; then
            echo "build cache over 1 GB: emptied, the next run fills it again"
            rm -rf "$PLATFORMIO_BUILD_CACHE_DIR"
          fi

      # w41h1_module.cpp needs LibreTiny, so this is the one build that compiles it. PlatformIO
      # writes the compile database in a few seconds, on a copy of the project: in the project
      # itself that target deletes the build output. Report only, as in esphome-esp32.
      - name: clang-tidy on the components as the stock-module build compiles them (report only)
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/tidy"
          "$RUNNER_TEMP/tidy/bin/pip" install --quiet "clang-tidy==$(sed -n 's/^CLANG_TIDY_VERSION=//p' firmware/scripts/cpp-lint.sh)"
          export CLANG_TIDY="$RUNNER_TEMP/tidy/bin/clang-tidy"
          # PlatformIO is installed beside esphome, in the environment pipx made for it.
          pio="$(dirname "$(readlink -f "$(command -v esphome)")")/pio"
          project="$RUNNER_TEMP/tidy-project"
          mkdir -p "$project"
          tar -C firmware/esphome/.esphome/build/ac-factory --exclude='.pio*' --exclude='.piolibdeps' -cf - . \
            | tar -C "$project" -xf -
          (cd "$project" && "$pio" run -t compiledb > compiledb.log 2>&1) || { tail -n 60 "$project/compiledb.log"; exit 1; }
          python3 firmware/scripts/esphome-glue-tidy.py "$project/compile_commands.json" | tee "$RUNNER_TEMP/tidy.log"
          {
            echo "## clang-tidy on the components, stock-module build (report only)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/tidy.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the PlatformIO tree
        if: ${{ github.ref == 'refs/heads/main' && steps.tree.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-amebaz2-tree-${{ env.ESPHOME_VERSION }}

      - name: Save the build cache
        if: ${{ github.ref == 'refs/heads/main' && steps.objects.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/w41h1/pio-objects
          key: pio-amebaz2-objects-${{ env.ESPHOME_VERSION }}-${{ hashFiles('firmware/esphome/packages/**', 'firmware/esphome/w41h1-amebaz2-*.yaml') }}

  # The ESP32 boards, which are the ones that run in A/C units: a real compile of every board
  # file that includes packages/esp32.yaml (the classic ESP32 file and both ESP32-C3 files: the
  # SuperMini with its status LED, the Plus with its RGB pixel and the RMT driver), plus the hub
  # with no entity platform. `esphome config` in host-qa cannot see a C++ error, and the AmebaZ2
  # job builds with another compiler. ESPHome builds these with ESP-IDF's own tools, not
  # PlatformIO, and keeps the framework and the two toolchains (Xtensa and RISC-V) under
  # ~/.cache/esphome/idf. ccache replays a cached object's compiler output, so the warning check
  # also sees warnings from objects this run did not compile. Compile-only: the images carry the
  # placeholder secrets and are thrown away.
  esphome-esp32:
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two entries, keyed as in esphome-amebaz2: the framework and the toolchains by the ESPHome
      # release (about 1 GB, saved once per release), the ccache by the release and the YAML
      # (capped below). Every run restores, only main saves, and only a key that is new.
      - name: Restore the ESP-IDF tree
        id: tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome/idf
          key: idf-esp32-tree-${{ env.ESPHOME_VERSION }}
          # An entry from before the split, until the first save under the key above.
          restore-keys: |
            idf-esphome-esp32-

      - name: Restore the ccache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/w41h1/ccache
          key: idf-esp32-ccache-${{ env.ESPHOME_VERSION }}-${{ hashFiles('firmware/esphome/packages/**', 'firmware/esphome/w41h1*.yaml', 'firmware/esphome/tests/build.hub-only.*.yaml') }}
          restore-keys: |
            idf-esp32-ccache-${{ env.ESPHOME_VERSION }}-

      - name: Compile the ESP32 board files
        env:
          # ESPHome switches ccache on when the binary is there. Capped, so the saved entry stays
          # well inside the cache quota.
          CCACHE_MAXSIZE: 600M
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache
          pipx install "esphome==$ESPHOME_VERSION"
          # ESPHome's default is a ccache inside the ESP-IDF tree. It gets a directory of its
          # own, so the tree's entry holds no objects.
          export CCACHE_DIR="$HOME/.cache/w41h1/ccache"
          # An entry from before the split holds the ccache inside the tree: move it out, so it
          # is used now and is not saved with the tree.
          if [ -d "$HOME/.cache/esphome/idf/ccache" ]; then
            if [ ! -d "$CCACHE_DIR" ]; then
              mkdir -p "$(dirname "$CCACHE_DIR")"
              mv "$HOME/.cache/esphome/idf/ccache" "$CCACHE_DIR"
            fi
            rm -rf "$HOME/.cache/esphome/idf/ccache"
          fi
          # Word splitting is wanted: the script prints a list of file names.
          # shellcheck disable=SC2046
          bash firmware/scripts/esphome-compile-check.sh $(bash .github/scripts/board-groups.sh esp32) \
            tests/build.hub-only.esp32-c3-idf.yaml
          ccache --show-stats | head -n 12 || true

      # wifi_setup_mode.cpp needs wifi:, so the host build of esphome-host-e2e does not have it,
      # and neither does it have the code under a platform #ifdef. The ESP32-C3 build above does,
      # and ESP-IDF wrote its compile database. Report only: the count goes to the log and the
      # summary. The two findings it has today are in hisense_ac.cpp, where a board build's log
      # level compiles ESP_LOGD and ESP_LOGV away and leaves switch branches that look the same.
      - name: clang-tidy on the components as the ESP32-C3 build compiles them (report only)
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/tidy"
          "$RUNNER_TEMP/tidy/bin/pip" install --quiet "clang-tidy==$(sed -n 's/^CLANG_TIDY_VERSION=//p' firmware/scripts/cpp-lint.sh)"
          export CLANG_TIDY="$RUNNER_TEMP/tidy/bin/clang-tidy"
          python3 firmware/scripts/esphome-glue-tidy.py \
            firmware/esphome/.esphome/build/ci-w41h1-esp32c3/build/compile_commands.json | tee "$RUNNER_TEMP/tidy.log"
          {
            echo "## clang-tidy on the components, ESP32-C3 build (report only)"
            echo
            echo '```'
            cat "$RUNNER_TEMP/tidy.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the ESP-IDF tree
        if: ${{ github.ref == 'refs/heads/main' && steps.tree.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/esphome/idf
          key: idf-esp32-tree-${{ env.ESPHOME_VERSION }}

      - name: Save the ccache
        if: ${{ github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/w41h1/ccache
          key: idf-esp32-ccache-${{ env.ESPHOME_VERSION }}-${{ hashFiles('firmware/esphome/packages/**', 'firmware/esphome/w41h1*.yaml', 'firmware/esphome/tests/build.hub-only.*.yaml') }}

  # The component end to end, with no hardware: host.yaml is packages/hisense-ac.yaml built for
  # ESPHome's `host` platform, a Linux program with a pseudo-terminal where a board has the A/C.
  # run.py starts it against firmware/test/virtual_ac.py and drives it over the native API as Home
  # Assistant does: every entity, every command frame, the hold-off, the re-sends, link loss, the
  # setup request, damaged replies. This is the only test that runs the hub and the entities
  # (hisense_ac.cpp, hisense_climate.cpp, hisense_switch.cpp, hisense_select.cpp); the host tests
  # compile the pure layers under them. The scenarios run four at a time, in about
  # two minutes, on the hub's real timers. The long ones (--full) run in nightly.yaml.
  esphome-host-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Two entries, keyed as in esphome-amebaz2. PlatformIO's tree here is only its `native`
      # platform (the compiler is the runner's own g++), a few MB that change with the ESPHome
      # release. The build cache holds the objects of ESPHome's core and of the components, by
      # content. Every run restores, only main saves, and only a key that is new.
      - name: Restore the PlatformIO tree
        id: tree
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-host-tree-${{ env.ESPHOME_VERSION }}

      - name: Restore the build cache
        id: objects
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/w41h1/pio-host-objects
          key: pio-host-objects-${{ env.ESPHOME_VERSION }}-${{ hashFiles('firmware/esphome/packages/**', 'firmware/test/host_e2e/*.yaml') }}
          restore-keys: |
            pio-host-objects-${{ env.ESPHOME_VERSION }}-

      # aioesphomeapi, the API client, is a dependency of esphome at the version that release
      # pins: run.py finds the Python esphome was installed into and runs under it.
      - name: Build the host program and run the scenarios
        run: |
          pipx install "esphome==$ESPHOME_VERSION"
          export PLATFORMIO_BUILD_CACHE_DIR="$HOME/.cache/w41h1/pio-host-objects"
          python3 firmware/test/host_e2e/run.py --require

      # The hub and the entities are outside the clang-tidy run of host-qa: cpp-lint.py compiles its
      # units with plain host flags and these files need ESPHome's headers. This build has them,
      # and PlatformIO writes its compile database in a second or two. A gate: any finding fails
      # the job, and so does a file clang could not parse (it has no finding either) or a run
      # with another clang-tidy than the one cpp-lint.sh pins. run.py itself only reports, so the
      # count is read from the line it prints.
      - name: clang-tidy on the hub and the entities
        run: |
          pin="$(sed -n 's/^CLANG_TIDY_VERSION=//p' firmware/scripts/cpp-lint.sh)"
          python3 -m venv "$RUNNER_TEMP/tidy"
          "$RUNNER_TEMP/tidy/bin/pip" install --quiet "clang-tidy==$pin"
          export CLANG_TIDY="$RUNNER_TEMP/tidy/bin/clang-tidy"
          log="$RUNNER_TEMP/tidy.log"
          status=0
          python3 firmware/test/host_e2e/run.py --no-build --tidy --require > "$log" 2>&1 || status=$?
          cat "$log"
          {
            echo "## clang-tidy on the hub and the entities"
            echo
            echo '```'
            cat "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 0 ]; then
            echo "::error::clang-tidy on the hub and the entities did not run (see above)"
            exit 1
          fi
          if grep -H -F 'clang-diagnostic-error' firmware/test/host_e2e/build/tidy/*/tidy-*.log; then
            echo "::error::clang-tidy could not parse a glue file (see above), so its count means nothing"
            exit 1
          fi
          if ! grep -qxF "== clang-tidy $pin on the glue: 0 finding(s) ==" "$log"; then
            echo "::error::clang-tidy $pin has findings in the hub or the entities (see above): fix them, or mark a false positive with NOLINT and the reason"
            exit 1
          fi

      # The same scenarios on a build with gcov: which lines and functions of the hub and the
      # entities they reach, as a table in the job summary. On main only, and never blocking.
      - name: What the scenarios reach (report only)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          export PLATFORMIO_BUILD_CACHE_DIR="$HOME/.cache/w41h1/pio-host-objects"
          log="$RUNNER_TEMP/host-e2e-coverage.log"
          python3 firmware/test/host_e2e/run.py --require --coverage > "$log" 2>&1 || { tail -n 120 "$log"; exit 1; }
          {
            echo "## What the host end-to-end scenarios reach"
            echo
            echo '```'
            sed -n '/^== what the scenarios reached/,$p' "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed -n '/^== what the scenarios reached/,$p' "$log"

      - name: Save the PlatformIO tree
        if: ${{ github.ref == 'refs/heads/main' && steps.tree.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-host-tree-${{ env.ESPHOME_VERSION }}

      - name: Save the build cache
        if: ${{ github.ref == 'refs/heads/main' && steps.objects.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/w41h1/pio-host-objects
          key: pio-host-objects-${{ env.ESPHOME_VERSION }}-${{ hashFiles('firmware/esphome/packages/**', 'firmware/test/host_e2e/*.yaml') }}

  # ESPHome's own CI gates, run against the hisense_ac component placed in a checkout of
  # esphome/esphome at the release this repo builds with (firmware/scripts/esphome-upstream-check.sh).
  # The same gates against their dev branch run in nightly.yaml, not here: that run installs
  # whatever their dev branch requires that day, which has no place in every pull request, and its
  # result does not depend on the pull request anyway (it is informational, and it changes when
  # their branch moves, not when this tree does).
  esphome-upstream:
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ESPHome upstream gates (the pinned release)
        run: bash firmware/scripts/esphome-upstream-check.sh
