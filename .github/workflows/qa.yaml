name: QA

# Hardware-free gate: the same checks the pre-commit hook runs (host codec + Matter<->A/C mapping +
# virtual-AC round-trip, .zap endpoint contiguity, softwareVersion sanity via `dev.py ota amebaz2 lint`),
# plus a PR-only check that firmware/src/version.txt strictly increases. No SDK, Pi, or chip.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege: this gate only reads the tree (checkout + host scripts), never writes.
permissions:
  contents: read

jobs:
  host-qa:
    # GitHub-only: Gitea mirrors this repo and auto-reads .github/workflows, but has no
    # ubuntu-latest runner (its self-hosted runner is sdk-builder). Skip on Gitea so the job
    # doesn't queue forever there; the Gitea build lives in .gitea/workflows/build.yaml.
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # PR version-diff needs base history

      # Static lint first (cheap, fails fast). Run these same two commands locally for parity.
      # shellcheck ships on the runner image; --severity=warning gates real bugs (quoting, unset
      # vars, logic) and skips the info/style nits the scripts intentionally use. ruff reads the
      # committed ruff.toml; it's pinned via pipx (bump with the local version + Dependabot).
      - name: Shell lint (shellcheck)
        run: |
          shellcheck --version
          shellcheck --severity=warning firmware/scripts/*.sh firmware/test/*.sh \
            firmware/.githooks/pre-commit firmware/.githooks/prepare-commit-msg

      - name: Python lint (ruff)
        run: pipx run ruff==0.15.20 check .

      # C/C++ lint over every tree we own (SDK-derived sdk-edits/ is excluded): clang-format
      # --dry-run -Werror, the ESPHome-derived custom rules, and clang-tidy over the host-compilable
      # set. The script pins clang-format 13.0.1 and clang-tidy 22.1.8 (ESPHome's pins) and installs
      # them into a private venv, since the runner's own clang-format is another major and formats
      # differently. Local parity: firmware/scripts/cpp-lint.sh check (fix applies the fixes).
      - name: C/C++ lint (clang-format, custom rules, clang-tidy)
        run: bash firmware/scripts/cpp-lint.sh check

      # The pre-commit hook's form: explicit paths after the options the wrapper inserts.
      - name: C/C++ lint, path form (as the pre-commit hook runs it)
        run: bash firmware/scripts/cpp-lint.sh check --no-tidy firmware/test/test_matter_map.cpp

      - name: ESP32 version consistency
        run: bash firmware/scripts/esp32-lint.sh

      - name: Host QA + lint
        run: python3 firmware/scripts/dev.py ota amebaz2 lint

      # The ESPHome variant has no other gate: its component is Python + C++ that the host tests
      # only reach through esphome_aircon_map.h, so a broken schema or a renamed option would
      # otherwise reach a user's first `esphome run`. `config` validates the YAML AND every
      # platform schema in components/hisense_ac without a toolchain, in seconds. The one full
      # compile is the esphome-amebaz2 job below.
      - name: ESPHome config validation
        run: |
          cd firmware/esphome
          cp secrets.yaml.example secrets.yaml   # placeholders; the real file is gitignored
          # Every board file: they share packages/, so a change made for one chip is checked
          # against all of them.
          for b in w41h1*.yaml; do pipx run esphome==2026.7.4 config "$b"; done
          # The exact invocation `dev.py --board c3` makes, which the deployed nodes were built with.
          pipx run esphome==2026.7.4 -s board esp32-c3-devkitm-1 -s tx_pin 5 -s rx_pin 6 -s de_pin 10 \
            config w41h1.yaml
          # The upstream-shaped component test (tests/components/hisense_ac/) sets every option of every
          # platform, which w41h1.yaml does not.
          for t in tests/build*.yaml; do pipx run esphome==2026.7.4 config "$t"; done

      - name: softwareVersion must increase vs base (when firmware changed)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Scope to firmware/src (the shipped image is built from it + the .zap under sdk-edits).
          # firmware/test is host-only QA that never changes the image, so a test-tooling edit must
          # NOT force a softwareVersion bump.
          # Compare against the MERGE-BASE, not the base tip. Against the tip, a branch that has
          # merely fallen behind main sees main's own firmware commits as its own and is told to
          # bump a version it never touched. That fired twice on docs-only PRs. The merge-base is
          # the fork point, so the diff is only ever what this branch actually changed.
          git fetch --no-tags origin "$BASE" || true
          MERGE_BASE=$(git merge-base FETCH_HEAD HEAD 2>/dev/null || echo FETCH_HEAD)
          # Exclude markdown: firmware/src carries docs (INTEGRATION.md, UART_PINS.md,
          # sdk-edits/README.md) that cannot reach the built image, so editing them must not demand
          # a firmware version bump. Scoping to the whole directory made a docs-only pass fail.
          if git diff --quiet "$MERGE_BASE" -- firmware/src ':(exclude)firmware/src/**/*.md'; then
            echo "no firmware/src code change vs $BASE (merge-base $(git rev-parse --short "$MERGE_BASE")) -- bump not required"; exit 0
          fi
          new=$(python3 firmware/scripts/dev.py ota amebaz2 verint "$(cat firmware/src/version.txt)")
          oldsem=$(git show "$MERGE_BASE:firmware/src/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
          old=$(python3 firmware/scripts/dev.py ota amebaz2 verint "${oldsem:-0}" 2>/dev/null || echo 0)
          echo "softwareVersion int: base($BASE)=$old  head=$new"
          if [ "${new:-0}" -le "$old" ]; then
            echo "::error::softwareVersion must strictly increase ($new <= $old) -- bump firmware/src/version.txt"
            exit 1
          fi

  # The stock module's own MCU through ESPHome's LibreTiny platform (w41h1-amebaz2.yaml). This
  # is the board file nobody builds on the way to an ESP32, and the one platform whose toolchain
  # is small enough for a hosted runner (about 800 MB, kept in the cache), so it gets a real
  # compile and not only `config`. Compile-only: the image carries the placeholder secrets and is
  # thrown away. It says nothing about a module, which needs the hardware test.
  esphome-amebaz2:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PlatformIO's tree: the LibreTiny platform, the Realtek SDK and the ARM toolchain. Every run
      # restores the newest entry. Only main saves one, so PR runs cannot fill the cache quota.
      - name: Restore the PlatformIO tree
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: pio-esphome-amebaz2-${{ github.run_id }}
          restore-keys: |
            pio-esphome-amebaz2-

      - name: Compile w41h1-amebaz2.yaml
        run: |
          cd firmware/esphome
          cp secrets.yaml.example secrets.yaml   # placeholders; the real file is gitignored
          if ! pipx run esphome==2026.7.4 compile w41h1-amebaz2.yaml > build.log 2>&1; then
            tail -n 200 build.log
            exit 1
          fi
          grep -a -E '^(RAM|Flash):|Successfully compiled' build.log
          # The SDK and the platform warn about their own code. Ours has to build clean here too:
          # this is the only target with a different compiler and different integer widths.
          if grep -a -E 'components/hisense_ac/.*(warning|error)' build.log; then
            echo "::error::hisense_ac does not compile cleanly for AmebaZ2 (see above)"
            exit 1
          fi
          # The reboot workaround in the board file points lt_reboot() at the SDK's sys_reset with
          # two linker flags. If a platform update drops sys_reset the link fails above.
          ls -l .esphome/build/hisense-ac/.pioenvs/hisense-ac/firmware.uf2

      - name: Save the PlatformIO tree
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: pio-esphome-amebaz2-${{ github.run_id }}

  # ESPHome's own CI gates, run against the hisense_ac component placed in a checkout of
  # esphome/esphome (see firmware/scripts/esphome-upstream-check.sh). The pinned-release run is
  # required. The dev run is informational: their rules move ahead of the release this repo builds
  # with (dev wants ESPHOME_LOG_TAG, which the pinned release does not define). A dev failure is
  # reported as a warning annotation and the job still passes, so it shows what an upstream pull
  # request would have to change without marking every commit as failed.
  esphome-upstream:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [pinned, dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ESPHome upstream gates (${{ matrix.ref }})
        env:
          REF: ${{ matrix.ref }}
        run: |
          if [ "$REF" = dev ]; then
            if ! ESPHOME_UPSTREAM_REF=dev bash firmware/scripts/esphome-upstream-check.sh; then
              echo "::warning title=ESPHome dev gates::The component does not pass ESPHome's dev-branch gates. See this job's log. Informational, not blocking."
            fi
          else
            bash firmware/scripts/esphome-upstream-check.sh
          fi
