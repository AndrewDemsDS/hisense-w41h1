name: Bug report
description: Something in the firmware, driver, or tooling doesn't behave as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is a personal reverse-engineering project for the Hisense AEH-W41H1 (RTL8710C /
        AmebaZ2) — no warranty, no vendor support. It assumes you're working on hardware you own.
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: The commit the node was built from (`git rev-parse --short HEAD`) and the ESPHome version.
      placeholder: 8c0f746, ESPHome 2026.7.4
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - ESP32 replacement board
        - Stock module (RTL8710C, LibreTiny)
        - Another ESPHome chip
        - Host QA / tooling only
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual. Include the exact command and the node's log lines.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
