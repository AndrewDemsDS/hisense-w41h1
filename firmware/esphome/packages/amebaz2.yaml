# The stock AEH-W41H1 module's own MCU (Realtek RTL8710C, AmebaZ2 family) through ESPHome's
# LibreTiny platform. Included by the three w41h1-amebaz2-*.yaml board files, which differ only in
# the flash layout they name.
#
# STATUS: the factory layout has run on a module in an A/C (2026-10-10): boot, Wi-Fi, the bus,
# and updates in both directions between the slots. The sdk and native layouts compile and have
# not run on hardware. Read firmware/docs/15-esphome-path.md ("The stock module through
# LibreTiny") before flashing a module.
#
# Substitutions the including file must define: layout (factory, sdk or native), plus the pins.
# There is no default layout on purpose: the wrong one bricks the unit at its first update.

esphome:
  # Copies amebaz2/ into the build: the layout files, and the headers (w41h1_slots.h,
  # w41h1_uart.h), which are also included.
  includes:
    - amebaz2
  platformio_options:
    # Overrides the board's slot and settings addresses. The path is relative to the build
    # directory, where the line above has just put the file.
    custom_board: src/amebaz2/layout-${layout}.json
  build_flags:
    # w41h1_slots.h fails the build unless the image's offsets are those of this layout.
    - -DW41H1_LAYOUT_${layout}=1
    # LibreTiny 1.13.0 reboots this family with a CPU-only reset, which can leave the chip dark
    # until power has been off for half a minute: after a restart, and after every OTA
    # (libretiny-eu/libretiny issue 396, fix proposed in pull request 397, not released). These
    # two flags point lt_reboot() at the SDK's watchdog system reset instead, the workaround
    # confirmed in that issue. They stay harmless once the fix ships. With them in the image, two
    # updates and one mains power cycle came back without a hang (one module, 2026-10-10).
    - -Wl,--wrap=lt_reboot
    - -Wl,--defsym=__wrap_lt_reboot=sys_reset
  on_boot:
    priority: -100
    then:
      - lambda: |-
          char report[96];
          w41h1_layout_report(report, sizeof(report));
          if (w41h1_layout_ok()) {
            ESP_LOGI("w41h1", "Flash layout: %s", report);
            return;
          }
          // The bootloader's partition table is not the one this image was built for. An update
          // would be written to the wrong place and the running image invalidated, so the
          // update server is switched off. Reflash with the board file for this unit's layout.
          ESP_LOGE("w41h1", "Flash layout: %s", report);
          ESP_LOGE("w41h1", "OTA is disabled: this image was built for another flash layout");
          id(ota_server).mark_failed();

ota:
  - platform: esphome
    id: ota_server

rtl87xx:
  # A Tuya module with the same chip (RTL8720CM class, 4 MB flash). It is used for its pin map:
  # it is the board definition that names PA13 / PA14 as UART0, which the
  # generic-rtl8720cm-4mb-1712k one does not. Its flash layout is replaced by the file above.
  board: cr3l

# The logger keeps LibreTiny's default port, UART2: TX on PA16, the module's own log console pad,
# at 115200 baud. It must never be moved to UART0, which is the A/C bus.

# Serial port recovery. On this module the receive side of the A/C bus port has stopped twice and
# stayed stopped until a power cycle, with transmit still working. The cause is not known;
# reopening the port restores it (amebaz2/w41h1_uart.h has what was measured). So the port is
# restarted the moment the hub reports the link lost, and every 15 s for as long as it stays
# down. This lives here and not in the component because Serial0 is LibreTiny's: ESPHome's uart
# component can only reload a port's settings on ESP32 and ESP8266.
interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!w41h1_uart_restart_due(&w41h1_uart_watch, id(ac_bus).link_up(), millis()))
            return;
          w41h1_uart_restart(id(uart_bus).get_baud_rate());
          ESP_LOGW("w41h1", "A/C bus silent: serial port restarted (%u so far)",
                   (unsigned) w41h1_uart_watch.restarts);

sensor:
  # How often the recovery above has fired since boot. On a healthy bus it stays at 0. It also
  # counts while the unit is off at the mains with the node powered some other way.
  - platform: template
    name: Serial port restarts
    icon: mdi:restart-alert
    entity_category: diagnostic
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: return (float) w41h1_uart_watch.restarts;

text_sensor:
  # The running slot, the address the bootloader gives for the next update, and whether that
  # agrees with the layout this image was built for. "MISMATCH" means: do not update this unit.
  - platform: template
    name: Flash layout
    icon: mdi:memory
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      char report[96];
      w41h1_layout_report(report, sizeof(report));
      return std::string(report);
