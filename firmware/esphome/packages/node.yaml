# The node itself: identity, logging, the Home Assistant API, Wi-Fi and the node's own diagnostics. Nothing here names a
# chip, so every board file includes it as is. A board file adds its platform block and whatever
# that platform needs on top (see w41h1-amebaz2.yaml for an example).
#
# Substitutions the including file must define: name, friendly_name.
# Substitutions it may override: wifi_power_save (below).

substitutions:
  # Wi-Fi power saving. These nodes run from the mains and are spoken to at any moment, so the
  # radio stays on: `none`. ESPHome's own default is `light` on ESP32 and RP2040, where the radio
  # sleeps between beacons. On an ESP32-C3 with a weak signal (about -77 dBm) that default gave
  # 65 % ping loss, an API connection dropping about once a minute, and commands that never
  # reached the unit. With `none`: 100 of 100 pings, a command taken in 0.5 s (2026-10-10). The
  # Matter firmware forces the radio on for the same reason. ESP8266 and LibreTiny already
  # default to `none`. The cost is current: the radio no longer sleeps between beacons. A board
  # on a supply too weak for that can go back with `wifi_power_save: light` in its board file,
  # or `-s wifi_power_save light` on the command line.
  wifi_power_save: none

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:
  # INFO is the deployed default: link and fault changes only. DEBUG adds each status change and
  # every command sent. VERBOSE adds every status frame and every poll that got no reply.
  # VERY_VERBOSE adds the raw bytes of every frame in both directions, which is the level to use
  # when the A/C is not answering.
  level: INFO

api:
  encryption:
    key: !secret hisense_ac__encryption_key
  # Home Assistant holds one connection permanently. The default leaves so little headroom that
  # a log stream plus a test client get refused mid-handshake ("EOF received"), which reads like
  # a broken device rather than a full table. Bench work needs the room.
  max_connections: 8

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: ${wifi_power_save}
  # Provisioning fallback. This replaces Matter commissioning outright: there is no fabric, no
  # BLE onboarding, and no "77" recommission dance to get back onto a network.
  ap:
    ssid: ${name}-setup

captive_portal:

# Node diagnostics, the same three on every board, so a node built from any board file shows what
# the nodes in the field show. All three exist on every platform the board files use (ESP32,
# ESP8266, RP2040, LibreTiny). The wording of "Reset reason" is the platform's own, so it differs
# between chips.
debug:

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi signal
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
      entity_category: diagnostic
