# The node itself: identity, logging, the Home Assistant API and Wi-Fi. Nothing here names a
# chip, so every board file includes it as is. A board file adds its platform block and whatever
# that platform needs on top (see w41h1-amebaz2.yaml for an example).
#
# Substitutions the including file must define: name, friendly_name.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:
  # INFO is the deployed default: link and fault changes only. DEBUG adds each status change and
  # every command sent. VERBOSE adds every status frame and every poll that got no reply.
  # VERY_VERBOSE adds the raw bytes of every frame in both directions, which is the level to use
  # when the A/C is not answering.
  level: INFO

api:
  encryption:
    key: !secret hisense_ac__encryption_key
  # Home Assistant holds one connection permanently. The default leaves so little headroom that
  # a log stream plus a test client get refused mid-handshake ("EOF received"), which reads like
  # a broken device rather than a full table. Bench work needs the room.
  max_connections: 8

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Provisioning fallback. This replaces Matter commissioning outright: there is no fabric, no
  # BLE onboarding, and no "77" recommission dance to get back onto a network.
  ap:
    ssid: ${name}-setup

captive_portal:
