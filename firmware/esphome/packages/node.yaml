# The node itself: identity, logging, the Home Assistant API, Wi-Fi and its setup mode, the
# node's own diagnostics, and the firmware version. Nothing here names a chip, so every board file
# includes it as is. A board file adds its platform block and whatever that platform needs on top
# (see w41h1-amebaz2-factory.yaml for an example).
#
# Substitutions the including file may override: name, friendly_name, wifi_power_save,
# wifi_setup_timeout (all below).
# Secrets it reads: wifi_ssid, wifi_password, wifi_ap_password, hisense_ac__encryption_key.
# It expects hisense-ac.yaml beside it: setup mode switches the panel's "77" through the hub, and
# takes its component from the source that file names (w41h1_components).

substitutions:
  # The node's name on the network (and the prefix of its setup hotspot) and the device name Home
  # Assistant shows. Two nodes on one network need two names: set both in the board file, or with
  # `-s name bedroom-ac -s friendly_name "Bedroom A/C"` on the command line.
  name: hisense-ac
  friendly_name: Air Conditioner
  # Wi-Fi power saving. These nodes run from the mains and are spoken to at any moment, so the
  # radio stays on: `none`. ESPHome's own default is `light` on ESP32 and RP2040, where the radio
  # sleeps between beacons. On an ESP32-C3 with a weak signal (about -77 dBm) that default gave
  # 65 % ping loss, an API connection dropping about once a minute, and commands that never
  # reached the unit. With `none`: 100 of 100 pings, a command taken in 0.5 s (2026-10-10).
  # ESP8266 and LibreTiny already default to `none`. The cost is current: the radio no longer
  # sleeps between beacons. A board on a supply too weak for that can go back with
  # `wifi_power_save: light` in its board file, or `-s wifi_power_save light` on the command line.
  wifi_power_save: none
  # How long setup mode (below) keeps the hotspot open before the node restarts onto the network
  # it had.
  wifi_setup_timeout: 10min

# The firmware version (esphome: project:), from the one file that holds it.
packages:
  version: !include version.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:
  # INFO is the deployed default: link and fault changes only. DEBUG adds each status change and
  # every command sent. VERBOSE adds every status frame and every poll that got no reply.
  # VERY_VERBOSE adds the raw bytes of every frame in both directions, which is the level to use
  # when the A/C is not answering.
  level: INFO

api:
  encryption:
    key: !secret hisense_ac__encryption_key
  # Home Assistant holds one connection permanently. The default leaves so little headroom that
  # a log stream plus a test client get refused mid-handshake ("EOF received"), which reads like
  # a broken device rather than a full table. Bench work needs the room.
  max_connections: 8

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: ${wifi_power_save}
  # The setup hotspot, with ESPHome's captive portal on it (http://192.168.4.1) to enter a new
  # network. It opens by itself when the configured network has not been reachable for a minute,
  # and on demand through setup mode below. It has a password because whoever joins it can
  # point the node at a network of their choosing.
  ap:
    ssid: ${name}-setup
    password: !secret wifi_ap_password

captive_portal:

# Setup mode: the hotspot on demand, while the configured network is still there. This is what the
# remote's "77" gesture (horizontal airflow six times) does on the stock module. Here the gesture,
# or the button below, opens the hotspot and puts "77" on the panel. It ends in a restart: after
# wifi_setup_timeout, when the gesture is repeated, or once a network entered in the portal has
# connected. A network that was entered and did not connect is replaced by the one the node had,
# also when the node restarts for another reason or loses power in between.
#
# All of it is the wifi_setup_mode component (components/wifi_setup_mode/, decisions in
# setup_mode_logic.h, host-tested). What is here is the wiring: its timeout, the gesture and the
# button. The component comes from the same place as the hub, which hisense-ac.yaml names
# (w41h1_components).
external_components:
  - source: ${w41h1_components}
    components: [wifi_setup_mode]

wifi_setup_mode:
  id: wifi_setup
  timeout: ${wifi_setup_timeout}

script:
  # What the hub's on_setup_request runs (hisense-ac.yaml). The gesture is both the way in and
  # the way out.
  - id: wifi_setup_toggle
    then:
      - wifi_setup_mode.toggle: wifi_setup

button:
  # The same thing from Home Assistant, for a unit whose remote is not at hand. The node drops
  # off the network at once and is back after wifi_setup_timeout at the latest.
  - platform: template
    name: Start Wi-Fi setup
    icon: mdi:wifi-cog
    entity_category: diagnostic
    on_press:
      - wifi_setup_mode.start: wifi_setup

# Node diagnostics, the same three on every board, so a node built from any board file shows what
# the nodes in the field show. All three exist on every platform the board files use (ESP32,
# ESP8266, RP2040, LibreTiny). The wording of "Reset reason" is the platform's own, so it differs
# between chips.
debug:

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi signal
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
      entity_category: diagnostic
