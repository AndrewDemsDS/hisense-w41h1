# The node itself: identity, logging, the Home Assistant API, Wi-Fi and its setup mode, the
# node's own diagnostics, and the firmware version. Nothing here names a chip, so every board file
# includes it as is. A board file adds its platform block and whatever that platform needs on top
# (see w41h1-amebaz2-factory.yaml for an example).
#
# Substitutions the including file must define: name, friendly_name.
# Substitutions it may override: wifi_power_save, wifi_setup_timeout (below).
# Secrets it reads: wifi_ssid, wifi_password, wifi_ap_password, hisense_ac__encryption_key.
# It expects the hub from hisense-ac.yaml beside it: setup mode switches the panel's "77" through it.

substitutions:
  # Wi-Fi power saving. These nodes run from the mains and are spoken to at any moment, so the
  # radio stays on: `none`. ESPHome's own default is `light` on ESP32 and RP2040, where the radio
  # sleeps between beacons. On an ESP32-C3 with a weak signal (about -77 dBm) that default gave
  # 65 % ping loss, an API connection dropping about once a minute, and commands that never
  # reached the unit. With `none`: 100 of 100 pings, a command taken in 0.5 s (2026-10-10).
  # ESP8266 and LibreTiny already default to `none`. The cost is current: the radio no longer
  # sleeps between beacons. A board on a supply too weak for that can go back with
  # `wifi_power_save: light` in its board file, or `-s wifi_power_save light` on the command line.
  wifi_power_save: none
  # How long setup mode (below) keeps the hotspot open before the node restarts onto the network
  # it had.
  wifi_setup_timeout: 10min

# The firmware version (esphome: project:), from the one file that holds it.
packages:
  version: !include version.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

logger:
  # INFO is the deployed default: link and fault changes only. DEBUG adds each status change and
  # every command sent. VERBOSE adds every status frame and every poll that got no reply.
  # VERY_VERBOSE adds the raw bytes of every frame in both directions, which is the level to use
  # when the A/C is not answering.
  level: INFO

api:
  encryption:
    key: !secret hisense_ac__encryption_key
  # Home Assistant holds one connection permanently. The default leaves so little headroom that
  # a log stream plus a test client get refused mid-handshake ("EOF received"), which reads like
  # a broken device rather than a full table. Bench work needs the room.
  max_connections: 8

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: ${wifi_power_save}
  # The setup hotspot, with ESPHome's captive portal on it (http://192.168.4.1) to enter a new
  # network. It opens by itself when the configured network has not been reachable for a minute,
  # and on demand through setup mode below. It has a password because whoever joins it can
  # point the node at a network of their choosing.
  ap:
    ssid: ${name}-setup
    password: !secret wifi_ap_password

captive_portal:

# Setup mode: the hotspot on demand, while the configured network is still there. This is what the
# remote's "77" gesture (horizontal airflow six times) does on the stock module. Here the gesture,
# or the button below, opens the hotspot and puts "77" on the panel. It ends in a restart: after
# wifi_setup_timeout, when the gesture is repeated, or once a network entered in the portal has
# connected. A restart is the clean way out because the Wi-Fi component opens its hotspot once
# per boot.
#
# How the hotspot is forced, with ESPHome's public Wi-Fi API only: ESPHome opens it when no
# network has been connected for `ap_timeout`. So Wi-Fi is switched off and on again with that
# timeout at 1 ms, and the station is pointed, in memory only, at a network that does not exist.
# Nothing is written to flash, so a power cut or a crash in setup mode comes back on the old
# network. The one thing the portal writes is what the user enters there. If that did not connect
# by the time setup mode ends, the credentials the node had before are written back first.
globals:
  - id: wifi_setup_active
    type: bool
    initial_value: "false"
  # The network the node was on, to put back if one entered in the portal fails, and the name of
  # the placeholder network, to tell whether the portal was used at all.
  - id: wifi_setup_prev_ssid
    type: std::string
  - id: wifi_setup_prev_password
    type: std::string
  - id: wifi_setup_parked_ssid
    type: std::string

script:
  # The gesture is both the way in and the way out.
  - id: wifi_setup_toggle
    then:
      - if:
          condition:
            lambda: return id(wifi_setup_active);
          then:
            - script.execute: wifi_setup_leave
          else:
            - script.execute: wifi_setup_enter

  - id: wifi_setup_enter
    mode: single
    then:
      - hisense_ac.set_setup_indicator: true
      - lambda: |-
          auto *net = wifi::global_wifi_component;
          id(wifi_setup_active) = true;
          if (net->is_ap_active()) {
            // The configured network was already out of reach and ESPHome opened the hotspot.
            ESP_LOGW("setup", "Wi-Fi setup mode: the hotspot is already open");
            return;
          }
          const wifi::WiFiAP current = net->get_sta();
          id(wifi_setup_prev_ssid) = current.get_ssid().c_str();
          id(wifi_setup_prev_password) = current.get_password().c_str();
          // A network name nobody has, with a key nobody knows, so nothing can answer to it.
          char name[20];
          char key[20];
          snprintf(name, sizeof(name), "setup-%08x", (unsigned) random_uint32());
          snprintf(key, sizeof(key), "%08x%08x", (unsigned) random_uint32(), (unsigned) random_uint32());
          id(wifi_setup_parked_ssid) = name;
          wifi::WiFiAP parked;
          parked.set_ssid(name);
          parked.set_password(key);
          ESP_LOGW("setup", "Wi-Fi setup mode: leaving the network and opening the hotspot");
          net->disable();
          net->set_ap_timeout(1);
          net->enable();
          // After enable(), which reloads credentials saved by an earlier use of the portal.
          net->set_sta(parked);
      - wait_until:
          condition:
            wifi.ap_active:
          timeout: 30s
      - if:
          condition:
            wifi.ap_active:
          then:
            - logger.log:
                level: WARN
                tag: setup
                format: "Wi-Fi setup mode: hotspot open, http://192.168.4.1"
            - wait_until:
                condition:
                  wifi.connected:
                timeout: ${wifi_setup_timeout}
          else:
            # ESPHome opens its hotspot once per boot. If it was open and closed again earlier in
            # this boot, it does not come back. The restart below clears that, and the next
            # request works.
            - logger.log:
                level: ERROR
                tag: setup
                format: "Wi-Fi setup mode: the hotspot did not open. Restarting, ask again after that"
      - script.execute: wifi_setup_leave

  - id: wifi_setup_leave
    then:
      - hisense_ac.set_setup_indicator: false
      - lambda: |-
          auto *net = wifi::global_wifi_component;
          id(wifi_setup_active) = false;
          const wifi::WiFiAP now = net->get_sta();
          const bool portal_used = !id(wifi_setup_parked_ssid).empty() && now.get_ssid() != id(wifi_setup_parked_ssid);
          if (net->is_connected()) {
            ESP_LOGW("setup", "Wi-Fi setup mode: connected, restarting");
          } else if (portal_used && !id(wifi_setup_prev_ssid).empty()) {
            // What was entered in the portal is in flash and did not connect. Without this the
            // node would come back up on it and stay off the network.
            ESP_LOGW("setup", "Wi-Fi setup mode: the network entered did not connect, restoring the previous one");
            net->save_wifi_sta(id(wifi_setup_prev_ssid), id(wifi_setup_prev_password));
          } else {
            ESP_LOGW("setup", "Wi-Fi setup mode: over, restarting onto the previous network");
          }
          App.safe_reboot();

button:
  # The same thing from Home Assistant, for a unit whose remote is not at hand. The node drops
  # off the network at once and is back after wifi_setup_timeout at the latest.
  - platform: template
    name: Start Wi-Fi setup
    icon: mdi:wifi-cog
    entity_category: diagnostic
    on_press:
      - script.execute: wifi_setup_enter

# Node diagnostics, the same three on every board, so a node built from any board file shows what
# the nodes in the field show. All three exist on every platform the board files use (ESP32,
# ESP8266, RP2040, LibreTiny). The wording of "Reset reason" is the platform's own, so it differs
# between chips.
debug:

sensor:
  - platform: uptime
    name: Uptime
    entity_category: diagnostic
  - platform: wifi_signal
    name: WiFi signal
    entity_category: diagnostic
    update_interval: 60s

text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
      entity_category: diagnostic
