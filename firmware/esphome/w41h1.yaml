# Hisense A/C over RS-485, ESPHome firmware. See firmware/docs/15-esphome-path.md for the design
# and what has been measured on hardware.
#
# This is the classic ESP32 board file, and the original entry point: it still takes the board and
# the pins as -s overrides, so anything that built it before builds the same node now. The other
# boards have a file of their own beside it (w41h1-*.yaml). All of them include the same
# packages, so the entities are defined once:
#
#   packages/node.yaml        identity, logger, API, Wi-Fi and setup mode, the firmware version
#   packages/ota.yaml         the update server
#   packages/hisense-ac.yaml  the bus, the hub and every entity
#
# Wiring, the pin tables and the ESP32-C3 GPIO warnings: docs/guide/ESP32-Replacement-Build.md.
#
#   flash:   esphome run firmware/esphome/w41h1.yaml
#   logs:    esphome logs firmware/esphome/w41h1.yaml
#
# A brand-new board should get `esphome run ... --device <port>` after an erase; a factory NVS
# with a stale Wi-Fi config is a known time sink (firmware/docs/16-esp32-board-notes.md).

substitutions:
  # name and friendly_name default to hisense-ac / Air Conditioner (packages/node.yaml). Set
  # both here for a second node on the same network.
  # Classic ESP32-D0WDQ6, the hardware-validated pin set. For an ESP32-C3 SuperMini use
  # w41h1-esp32c3.yaml, or override here: board esp32-c3-devkitm-1 with tx 5 / rx 6 / de 10
  # (`firmware/scripts/dev.py --board c3` passes exactly these as -s overrides).
  board: esp32dev
  tx_pin: "19"
  rx_pin: "18"
  de_pin: "4"

packages:
  node: !include packages/node.yaml
  ota: !include packages/ota.yaml
  hisense_ac: !include packages/hisense-ac.yaml

esp32:
  board: ${board}
  framework:
    type: esp-idf
