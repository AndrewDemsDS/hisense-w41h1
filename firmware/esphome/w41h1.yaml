# Hisense A/C over RS-485, ESPHome variant. See firmware/docs/15-esphome-path.md for why this
# exists and what it does and does not cover versus the Matter builds.
#
# Wiring is identical to the esp-matter ESP32 path; the pin tables and the C3 GPIO warnings in
# firmware/esp32-matter/README.md apply unchanged. Note there is NO `uart:` block: the driver's
# HAL opens the port itself so the validated DE timing is untouched.
#
#   flash:   esphome run firmware/esphome/w41h1.yaml
#   logs:    esphome logs firmware/esphome/w41h1.yaml
#
# A brand-new board should get `esphome run ... --device <port>` after an erase; a factory NVS
# with a stale Wi-Fi config is a known time sink (see the esp32-matter README).

substitutions:
  name: hisense-ac
  friendly_name: Air Conditioner
  # Classic ESP32-D0WDQ6, the hardware-validated pin set. For an ESP32-C3 SuperMini use
  # tx 5 / rx 6 / de 10 and switch the `esp32:` block below to board: esp32-c3-devkitm-1.
  tx_pin: "19"
  rx_pin: "18"
  de_pin: "4"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components
    components: [hisense_ac]

logger:
  # INFO is the deployed default. Raise to DEBUG on the bench to see the decoded status frames
  # and the outgoing command shadow (hisense_ac logs both), which is how the fan-command and
  # setpoint bugs were pinned down on 2026-08-18.
  level: INFO

api:
  encryption:
    key: !secret hisense_ac__encryption_key
  # Home Assistant holds one connection permanently. The default leaves so little headroom that
  # a log stream plus a test client get refused mid-handshake ("EOF received"), which reads like
  # a broken device rather than a full table. Bench work needs the room.
  max_connections: 8
  services:
    # Bench probe: send the combined frame with ONE byte patched, to locate an unknown field
    # (the sleep command byte is the open one). Writes an arbitrary payload byte, so it is a
    # bench instrument, not something to bind to a dashboard button.
    - service: tx_override
      variables:
        offset: int
        value: int
      then:
        - lambda: 'id(ac_bus).tx_override(offset, value);' 

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Provisioning fallback. This replaces Matter commissioning outright: there is no fabric, no
  # BLE onboarding, and no "77" recommission dance to get back onto a network.
  ap:
    ssid: ${name}-setup

captive_portal:

# Only needed by total_daily_energy below, to know when the day rolls over.
time:
  - platform: homeassistant
    id: ha_time

hisense_ac:
  id: ac_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  de_pin: ${de_pin}

climate:
  - platform: hisense_ac
    name: None
    hisense_ac_id: ac_bus
    # Set to false on a cooling-only unit. The capability_* binary sensors below report what
    # your A/C actually answers to the 0x66/40 ProductType poll.
    supports_heat: true
    # Most W41H1 units have no left/right louvre motor; turn on only if yours does.
    supports_horizontal_swing: false

# Special modes. Eco and turbo are mutually exclusive on this bus (they share a command byte);
# quiet and the sleep profile are independent. Delete any your unit does not support.
switch:
  - platform: hisense_ac
    hisense_ac_id: ac_bus
    eco:
      name: Eco
    turbo:
      name: Turbo
    quiet:
      name: Quiet
    display:
      name: Panel display

# Sleep is commented out until its command encoding is known. The A/C reports t_sleep as
# supported, and the status side is confirmed (byte 17 = profile * 2), but nothing we send moves
# it: byte 17 = profile*2+1 is inherited from a 3-speed reference implementation and was never
# confirmed on a W41H1. Verified on hardware 2026-08-19 -- all five profiles commanded, the
# frame demonstrably accepted (it cleared mute via byte 35), and sleep_raw never moved once.
# An entity that silently does nothing is worse than no entity; re-enable when the byte is found.
# select:
#   - platform: hisense_ac
#     hisense_ac_id: ac_bus
#     sleep_profile:
#       name: Sleep profile

sensor:
  - platform: hisense_ac
    hisense_ac_id: ac_bus
    outdoor_temperature:
      name: Outdoor temperature
    coil_temperature:
      name: Coil temperature
    compressor_frequency:
      name: Compressor frequency
    power:
      name: Power
      id: ac_power
    voltage:
      name: Voltage
    current:
      name: Current
    checksum_errors:
      name: Bus checksum errors

  # Energy for the HA Energy dashboard, integrated from the power estimate. The Matter path
  # had no equivalent: this is one of the things ESPHome gives away for free.
  - platform: total_daily_energy
    name: Energy today
    power_id: ac_power
    unit_of_measurement: kWh
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

binary_sensor:
  - platform: hisense_ac
    hisense_ac_id: ac_bus
    aux_heat:
      name: Aux heat relay
    bus_link:
      name: AC bus link
    problem:
      name: Fault
    # Per-bit fault detail. Add any of the other 15 bits from binary_sensor.py the same way;
    # these four are the ones that have actually fired on a bench unit.
    fault_indoor_temp:
      name: Fault indoor temp sensor
    fault_indoor_comms:
      name: Fault indoor to outdoor comms
    fault_water_full:
      name: Fault condensate tray full
    fault_outdoor_temp:
      name: Fault outdoor temp sensor
    # What the A/C says it supports, from the ProductType poll. Use these to decide which
    # controls to declare above.
    capability_cool_heat:
      name: Capability heat pump
    capability_power_save:
      name: Capability eco
    capability_fan_mute:
      name: Capability quiet

text_sensor:
  - platform: hisense_ac
    hisense_ac_id: ac_bus
    link_token:
      name: AC device type
