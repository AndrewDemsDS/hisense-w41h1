# Hisense A/C over RS-485, ESPHome variant: the stock AEH-W41H1 module itself, FACTORY flash layout.
#
# For a module that still has the factory partition table: one that went from the vendor firmware
# to this project's firmware over the air. Slots at 0x010000 and 0x190000, 0x170000 bytes each.
#
# The layout is not a preference. It has to be the one already in the module's flash, or the
# first update bricks the unit. How to tell which one a unit has:
# firmware/docs/15-esphome-path.md, "Which flash layout a unit has".
#
# STATUS: compiles, hardware test pending.
#
#   build:   esphome compile firmware/esphome/w41h1-amebaz2-factory.yaml

substitutions:
  name: hisense-ac
  friendly_name: Air Conditioner
  layout: factory
  # The module's own wiring (reverse-engineering/docs/01-hardware.md): UART0 to the RS-485
  # transceiver, DE on PA17. These are not a choice. ESPHome's LibreTiny UART only takes a port's
  # fixed hardware pins, and PA14 / PA13 are UART0 on this board definition.
  tx_pin: PA14
  rx_pin: PA13
  de_pin: PA17

packages:
  node: !include packages/node.yaml
  hisense_ac: !include packages/hisense-ac.yaml
  amebaz2: !include packages/amebaz2.yaml
