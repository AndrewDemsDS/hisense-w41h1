# Hisense A/C over RS-485, ESPHome variant: the stock AEH-W41H1 module itself, LibreTiny's own
# flash layout.
#
# Only for a module written from scratch with the clip: LibreTiny's partition table, its
# bootloader and this image, all three. Slots at 0x010000 and 0x1BC000, 0x1AC000 bytes each,
# settings at 0x3F8000. On a module that still has the factory or the SDK partition table this
# image bricks the unit at its first update, and its settings area lands on data the earlier
# firmware keeps at the top of flash. Use w41h1-amebaz2-factory.yaml or -sdk.yaml there.
#
# How to tell which layout a unit has: firmware/docs/15-esphome-path.md, "Which flash layout a
# unit has".
#
# STATUS: compiles, never run on hardware. Only the factory layout has run on a module.
#
#   build:   esphome compile firmware/esphome/w41h1-amebaz2-native.yaml

# The chip, the board definition and the module's fixed pins (UART0 on PA14 / PA13, DE on PA17)
# are in packages/amebaz2.yaml. The layout is all this file adds.
substitutions:
  # name and friendly_name default to hisense-ac / Air Conditioner (packages/node.yaml). Set
  # both here for a second node on the same network.
  layout: native

packages:
  node: !include packages/node.yaml
  hisense_ac: !include packages/hisense-ac.yaml
  amebaz2: !include packages/amebaz2.yaml
