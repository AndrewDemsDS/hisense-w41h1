# packages/node.yaml without hisense-ac.yaml: setup mode switches the panel's "77" through the hub.
# The message names the missing component, not the missing package.
# expect: Component wifi_setup_mode requires component hisense_ac
substitutions:
  name: invalid-case
  friendly_name: Invalid case
  tx_pin: "5"
  rx_pin: "6"
  de_pin: "10"
  w41h1_components:
    type: local
    path: ../../components

packages:
  node: !include ../../packages/node.yaml
  ota: !include ../../packages/ota.yaml

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
