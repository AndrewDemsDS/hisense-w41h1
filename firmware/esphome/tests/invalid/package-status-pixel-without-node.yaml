# packages/status-pixel.yaml without node.yaml: its lambda asks the wifi_setup_mode component what to
# show (wifi_setup), which node.yaml defines.
# The message names the missing id, not the missing package.
# expect: Couldn't find ID 'wifi_setup'
substitutions:
  name: invalid-case
  friendly_name: Invalid case
  tx_pin: "5"
  rx_pin: "6"
  de_pin: "10"
  w41h1_components:
    type: local
    path: ../../components
  status_pixel_pin: GPIO8
  status_pixel_strapping_ok: "true"

packages:
  status_pixel: !include ../../packages/status-pixel.yaml

esphome:
  name: ${name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

wifi:
  ssid: example-ssid
  password: example-password

external_components:
  - source: ${w41h1_components}
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10
