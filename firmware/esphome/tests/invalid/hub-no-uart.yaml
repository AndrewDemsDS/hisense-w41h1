# The hub with no uart: block at all.
# expect: Component hisense_ac requires component uart
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10
