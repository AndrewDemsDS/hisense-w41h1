# Two climate entities on one hub. The hub hands each status frame to one climate entity, so a
# second one would never update.
# expect: Only one hisense_ac climate entity per hub: 2 are declared for 'ac_bus'
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10

climate:
  - platform: hisense_ac
    name: AC
  - platform: hisense_ac
    name: AC again
