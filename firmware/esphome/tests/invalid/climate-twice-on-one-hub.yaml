# Two climate entities on one hub.
# accepted: the hub keeps one climate pointer (HisenseAC::set_climate), so the entity set up
# last gets the unit's state and the other one never updates. climate.py does not refuse it.
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10

climate:
  - platform: hisense_ac
    name: AC
  - platform: hisense_ac
    name: AC again
