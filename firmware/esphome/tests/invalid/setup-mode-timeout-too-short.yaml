# wifi_setup_timeout below 30 s: not enough to join the hotspot.
# expect: value must be at least 30s
substitutions:
  name: invalid-case
  friendly_name: Invalid case
  tx_pin: "5"
  rx_pin: "6"
  de_pin: "10"
  w41h1_components:
    type: local
    path: ../../components
  wifi_setup_timeout: 5s

packages:
  node: !include ../../packages/node.yaml
  ota: !include ../../packages/ota.yaml
  hisense_ac: !include ../../packages/hisense-ac.yaml

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
