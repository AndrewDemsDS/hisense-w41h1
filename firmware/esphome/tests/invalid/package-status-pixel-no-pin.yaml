# packages/status-pixel.yaml without status_pixel_pin.
# expect: 'status_pixel_pin' is undefined
# expect: Cannot resolve pin name '\$\{status_pixel_pin\}'
substitutions:
  name: invalid-case
  friendly_name: Invalid case
  tx_pin: "5"
  rx_pin: "6"
  de_pin: "10"
  w41h1_components:
    type: local
    path: ../../components

packages:
  node: !include ../../packages/node.yaml
  ota: !include ../../packages/ota.yaml
  hisense_ac: !include ../../packages/hisense-ac.yaml
  status_pixel: !include ../../packages/status-pixel.yaml

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
