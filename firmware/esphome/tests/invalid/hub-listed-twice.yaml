# Two hubs written as a list under one hisense_ac: key, on one UART.
# expect: hisense_ac can be listed only once: the component drives one A/C bus
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600

hisense_ac:
  - id: ac_bus
    uart_id: uart_bus
    de_pin: GPIO10
  - id: ac_bus_2
    uart_id: uart_bus
    de_pin: GPIO7
