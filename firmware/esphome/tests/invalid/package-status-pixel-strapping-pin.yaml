# packages/status-pixel.yaml on GPIO8 of an ESP32-C3 without status_pixel_strapping_ok: ESPHome warns, as it should.
# accepted: by design, with the warning below. The Plus board file sets status_pixel_strapping_ok.
# warns: GPIO8 is a strapping pin
substitutions:
  name: invalid-case
  friendly_name: Invalid case
  tx_pin: "5"
  rx_pin: "6"
  de_pin: "10"
  w41h1_components:
    type: local
    path: ../../components
  status_pixel_pin: GPIO8

packages:
  node: !include ../../packages/node.yaml
  ota: !include ../../packages/ota.yaml
  hisense_ac: !include ../../packages/hisense-ac.yaml
  status_pixel: !include ../../packages/status-pixel.yaml

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf
