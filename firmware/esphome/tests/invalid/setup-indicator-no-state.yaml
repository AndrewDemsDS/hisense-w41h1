# hisense_ac.set_setup_indicator without a state.
# UNHELPFUL: the message should be "'state' is a required option". It comes from
# cv.maybe_simple_value, which takes a mapping without the key as the value itself.
# expect: Expected boolean value, but cannot convert \{'id': 'ac_bus'\} to a boolean
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10
  on_setup_request:
    - hisense_ac.set_setup_indicator:
        id: ac_bus
