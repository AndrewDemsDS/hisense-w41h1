# on_setup_request with an action that does not exist.
# expect: Unable to find action with the name 'hisense_ac.open_hotspot'
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10
  on_setup_request:
    - hisense_ac.open_hotspot:
