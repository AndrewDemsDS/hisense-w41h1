# No de_pin and no flow_control_pin on the UART: nothing drives the transceiver's DE line.
# accepted: by design, with the warning below. It is right for a transceiver that switches
# direction by itself, and the warning says what happens with one that does not.
# warns: hisense_ac has no de_pin and its uart has no flow_control_pin
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
