# The A/C bus is 8N1.
# expect: hisense_ac requires 1 stop bits
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600
    stop_bits: 2

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10
