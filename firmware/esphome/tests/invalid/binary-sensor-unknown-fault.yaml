# A fault bit the component does not have.
# expect: \[fault_compressor\] is an invalid option for \[binary_sensor.hisense_ac\]
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    baud_rate: 9600

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10

binary_sensor:
  - platform: hisense_ac
    fault_compressor:
      name: Fault compressor
