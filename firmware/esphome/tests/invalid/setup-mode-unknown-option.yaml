# An option wifi_setup_mode does not have.
# expect: \[on_enter\] is an invalid option for \[wifi_setup_mode\]
substitutions:
  name: invalid-case
  friendly_name: Invalid case
  tx_pin: "5"
  rx_pin: "6"
  de_pin: "10"
  w41h1_components:
    type: local
    path: ../../components

packages:
  node: !include ../../packages/node.yaml
  ota: !include ../../packages/ota.yaml
  hisense_ac: !include ../../packages/hisense-ac.yaml

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

wifi_setup_mode:
  on_enter:
    - logger.log: "in"
