# DE driven twice: by the hub (de_pin) and by the UART peripheral (flow_control_pin), on two pins.
# accepted: DE is then driven twice, by the hub and by the UART peripheral. Nothing checks it.
esphome:
  name: invalid-case

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../../components
    components: [hisense_ac]

uart:
  - id: uart_bus
    tx_pin: GPIO5
    rx_pin: GPIO6
    flow_control_pin: GPIO7
    baud_rate: 9600

hisense_ac:
  id: ac_bus
  uart_id: uart_bus
  de_pin: GPIO10
