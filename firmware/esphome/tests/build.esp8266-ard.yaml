# Repo-only harness: supplies what ESPHome's own tests/test_build_components base config would,
# so `esphome config` (CI) and `esphome compile` can run the upstream-shaped test for esp8266-ard.
esphome:
  name: hisense-ac-test

esp8266:
  board: d1_mini

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [hisense_ac]

packages:
  hisense_ac: !include components/hisense_ac/test.esp8266-ard.yaml
