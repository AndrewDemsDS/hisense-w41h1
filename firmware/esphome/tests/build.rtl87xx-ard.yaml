# Repo-only harness for the stock module's own MCU (AmebaZ2 through LibreTiny). It builds two
# things the w41h1-amebaz2-*.yaml board files do not: every option of every hisense_ac platform,
# and the upstream-shaped test of w41h1_module (tests/components/w41h1_module/). hisense_ac has
# no test.rtl87xx-ard.yaml beside its others, because ESPHome ships no shared UART test package
# for this platform: the bus, the hub and the DE pin come from the w41h1_module test, which has
# to give them anyway. Never flash this one: it names the factory flash layout only because
# w41h1_module requires one.
esphome:
  name: hisense-ac-test

rtl87xx:
  board: cr3l

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [hisense_ac, w41h1_module]

substitutions:
  de_pin: PA17

packages:
  hisense_ac: !include components/hisense_ac/common.yaml
  w41h1_module: !include components/w41h1_module/test.rtl87xx-ard.yaml
