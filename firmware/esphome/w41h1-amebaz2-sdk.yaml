# Hisense A/C over RS-485, ESPHome variant: the stock AEH-W41H1 module itself, SDK flash layout.
#
# For a module whose flash was first written with this repo's clip image
# (flash_rac-integrated-*.bin): it has the Realtek SDK's partition table. Slots at 0x00C000 and
# 0x1B8000, 0x1AC000 bytes each.
#
# The layout is not a preference. It has to be the one already in the module's flash, or the
# first update bricks the unit. How to tell which one a unit has:
# firmware/docs/15-esphome-path.md, "Which flash layout a unit has".
#
# STATUS: compiles, never run on hardware. Only the factory layout has run on a module.
#
#   build:   esphome compile firmware/esphome/w41h1-amebaz2-sdk.yaml

# The chip, the board definition and the module's fixed pins (UART0 on PA14 / PA13, DE on PA17)
# are in packages/amebaz2.yaml. The layout is all this file adds.
substitutions:
  # name and friendly_name default to hisense-ac / Air Conditioner (packages/node.yaml). Set
  # both here for a second node on the same network.
  layout: sdk

packages:
  node: !include packages/node.yaml
  hisense_ac: !include packages/hisense-ac.yaml
  amebaz2: !include packages/amebaz2.yaml
