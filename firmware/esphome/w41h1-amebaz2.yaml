# Hisense A/C over RS-485, ESPHome variant: the stock AEH-W41H1 module itself.
#
# The module's own MCU (Realtek RTL8710C, AmebaZ2 family) through ESPHome's LibreTiny platform, so
# no replacement board is needed. Same entities as every other board file.
#
# STATUS: compiles, hardware test pending. Nothing in this file has run on a module yet. Read
# firmware/docs/15-esphome-path.md ("The stock module through LibreTiny") before flashing one:
# the first flash needs the SOIC-8 clip or UART download mode, there is no automatic rollback,
# and the calibration data at flash 0x1000..0x3FFF must survive.
#
#   build:   esphome compile firmware/esphome/w41h1-amebaz2.yaml
#   update:  esphome run firmware/esphome/w41h1-amebaz2.yaml     (OTA, once a module runs this)

substitutions:
  name: hisense-ac
  friendly_name: Air Conditioner
  # The module's own wiring (reverse-engineering/docs/01-hardware.md): UART0 to the RS-485
  # transceiver, DE on PA17. These are not a choice. ESPHome's LibreTiny UART only takes a port's
  # fixed hardware pins, and PA14 / PA13 are UART0 on this board definition.
  tx_pin: PA14
  rx_pin: PA13
  de_pin: PA17

packages:
  node: !include packages/node.yaml
  hisense_ac: !include packages/hisense-ac.yaml

esphome:
  # LibreTiny 1.13.0 reboots this family with a CPU-only reset, which can leave the chip dark
  # until power has been off for half a minute: after a restart, and after every OTA
  # (libretiny-eu/libretiny issue 396, fix proposed in pull request 397, not released). These two
  # flags point lt_reboot() at the SDK's watchdog system reset instead, the workaround confirmed
  # in that issue. They stay harmless once the fix ships.
  build_flags:
    - -Wl,--wrap=lt_reboot
    - -Wl,--defsym=__wrap_lt_reboot=sys_reset

rtl87xx:
  # A Tuya module with the same chip (RTL8720CM class, 4 MB flash, 2 x 1712 KiB app slots). It is
  # used for its pin map: it is the board definition that names PA13 / PA14 as UART0, which the
  # generic-rtl8720cm-4mb-1712k one does not.
  board: cr3l

# The logger keeps LibreTiny's default port, UART2: TX on PA16, the module's own log console pad,
# at 115200 baud. It must never be moved to UART0, which is the A/C bus.
